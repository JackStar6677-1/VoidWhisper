{% extends "base.html" %}
{% block mobile_title %}Nuevo personaje{% endblock %}
{% block content %}
<div class="viewport-center">
    <div class="page-shell" style="max-width: 900px;">
        <div class="surface-card">
            <h1 class="page-title" style="font-size: 1.5rem;">Crear desde "{{ base_character.name }}"</h1>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">
                Edita el nombre y el prompt del sistema. Puedes modificar apariencia, personalidad e historia.
            </p>
            <form method="POST">
                <label for="name">Nombre del nuevo personaje</label>
                <input type="text" id="name" name="name" value="{{ base_character.name }} (Editado)" required>

                <label for="system_prompt">System Prompt</label>
                <textarea id="system_prompt" name="system_prompt" rows="12" required>{{ base_character.system_prompt }}</textarea>

                <div class="inline-actions" style="justify-content: flex-end; margin-top: 1rem;">
                    <a class="action-link" href="{{ url_for('index') }}">← Volver</a>
                    <button type="submit">Crear personaje</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
