{% extends "base.html" %}

{% block content %}
<div class="viewport-center">
    <div class="page-shell" style="max-width: 860px;">
        <div class="page-hero">
            <span class="section-pill">Preset</span>
            <h1 class="page-title">Editar Preset</h1>
            <p class="page-subtitle">Ajusta el tono de generación con una vista limpia y consistente con el resto de VoidWhisper.</p>
        </div>

        <div class="surface-card">
            <form method="POST">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" value="{{ preset_name }}" required>

                <div style="display:flex; gap: 10px;">
                    <div style="flex:1">
                        <label for="temperature">Temperature</label>
                        <input type="text" id="temperature" name="temperature" value="{{ preset.temperature }}" required>
                    </div>
                    <div style="flex:1">
                        <label for="top_p">Top p</label>
                        <input type="text" id="top_p" name="top_p" value="{{ preset.top_p }}" required>
                    </div>
                </div>

                <div style="display:flex; gap: 10px;">
                    <div style="flex:1">
                        <label for="min_p">Min p</label>
                        <input type="text" id="min_p" name="min_p" value="{{ preset.min_p }}" required>
                    </div>
                    <div style="flex:1">
                        <label for="repetition_penalty">Repetition penalty</label>
                        <input type="text" id="repetition_penalty" name="repetition_penalty" value="{{ preset.repetition_penalty }}" required>
                    </div>
                    <div style="flex:1">
                        <label for="max_length">Max length</label>
                        <input type="number" id="max_length" name="max_length" value="{{ preset.max_length }}" required>
                    </div>
                </div>

                <div class="inline-actions" style="justify-content:flex-end; margin-top: 1rem;">
                    <a class="action-link" href="{{ url_for('settings_view') }}">Volver</a>
                    <button type="submit">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
